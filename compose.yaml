services:
  ozon-monitor:
    build: .
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./config.json:/app/config.json:ro
      - monitor-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"

volumes:
  monitor-data:
